server.port=9999

# magic-api web UI entry point
magic-api.web=/magic/web

# Where magic-api persists interface scripts (mapped to a Docker volume)
magic-api.resource.location=/data/magic-api

# HTTP prefix for generated APIs (empty = root). Optional.
# magic-api.prefix=/

# Exclude Spring's DataSource auto-configuration so the app starts without a JDBC
# datasource. magic-api manages its own datasources at runtime via the web UI.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
