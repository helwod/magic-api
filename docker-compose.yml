# 说明：
#  - 根目录 .env 由 docker compose 自动加载，用于本文件的 ${VAR} 变量替换；
#  - env_file: .env 把同一份变量注入容器环境，Spring Boot 经宽松绑定
#    读取（MAGIC_API_WEB -> magic-api.web、SERVER_PORT -> server.port …）；
#  - 多数配置改 .env 后 `docker compose up -d` 即生效；数据目录 MAGIC_API_RESOURCE_LOCATION 由入口脚本
#    读取（不再需要 build args），改路径后 `docker compose build` 重建镜像即可（种子固定烤在镜像内）。

services:
  magic-api:
    build: .
    image: helwod/magic-api:${MAGIC_API_IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-magic-api}
    # 端口映射 宿主机:容器（HOST_PORT / SERVER_PORT 均来自 .env）
    ports:
      - "${HOST_PORT:-9999}:${SERVER_PORT:-9999}"
    # 注入 .env 全部变量到容器环境，供 Spring Boot 读取（核心 env 映射）
    env_file:
      - .env
    volumes:
      # ===== 接口脚本数据（持久化 + 首次灌示例） =====
      # 数据目录由命名卷 magic-api-data 持久承载，挂载点 = MAGIC_API_RESOURCE_LOCATION（变量路径）。
      # 入口脚本 docker-entrypoint.sh 在目录为空时从镜像内种子 /opt/magic-api-seed 灌入示例数据；
      # 非空则保留（UI 改动不丢）→ 同时满足「变量路径 / 长久保存 / 初始化示例」。
      # 想改用宿主机目录持久化（落盘到本项目 data/ 之外），把下面一行换成绑定挂载即可：
      #   - ${MAGIC_API_DATA_DIR:-./data/magic-api}:${MAGIC_API_RESOURCE_LOCATION:-/data/magic-api}
      - magic-api-data:${MAGIC_API_RESOURCE_LOCATION:-/data/magic-api}

      # 外部覆盖配置目录，优先级高于 jar 内 application.yml（仅当 config/application.yml 存在时生效）
      - ./config:/app/config
    # 数据走命名卷（Docker 托管，Windows 无需 File Sharing）；仅 ./config 为绑定挂载（当前主机可挂载）。
    # 数据库模式：mysql 已启用，magic-api 启动前先等 mysql 就绪
    depends_on:
     - mysql
    restart: unless-stopped

  # ---- 可选：随容器启动的 MySQL（生产建议用外部托管数据库） ----
  # 启用步骤：取消注释本服务，并把上方 magic-api 的 depends_on 打开；
  #          再在 .env 中填写 SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/magic_api?... 并清空 DATASOURCE_EXCLUDE。
  mysql:
    image: mysql:8.4.0
    container_name: magic-api-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magic
      MYSQL_USER: magic
      MYSQL_PASSWORD: magic

    volumes:
       - magic-api-mysql:/var/lib/mysql
    restart: unless-stopped

volumes:
  # 接口脚本数据：命名卷持久化（首次启动由入口脚本灌入示例数据）
  magic-api-data:
  # MySQL 数据持久化
  magic-api-mysql:
