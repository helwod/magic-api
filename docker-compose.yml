# 说明：
#  - 根目录 .env 由 docker compose 自动加载，用于本文件的 ${VAR} 变量替换；
#  - env_file: .env 把同一份变量注入容器环境，Spring Boot 经宽松绑定
#    读取（MAGIC_API_WEB -> magic-api.web、SERVER_PORT -> server.port …）；
#  - 修改配置只需编辑 .env 后执行 `docker compose up -d`，无需重新构建镜像。

services:
  magic-api:
    build: .
    image: helwod/magic-api:${MAGIC_API_IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-magic-api}
    # 端口映射 宿主机:容器（HOST_PORT / SERVER_PORT 均来自 .env）
    ports:
      - "${HOST_PORT:-9999}:${SERVER_PORT:-9999}"
    # 注入 .env 全部变量到容器环境，供 Spring Boot 读取（核心 env 映射）
    env_file:
      - .env
    volumes:
      # ===== 接口脚本持久化（resource.type=file 时） =====
      - magic-api-data:${MAGIC_API_RESOURCE_LOCATION:-/data/magic-api}

      # 外部覆盖配置目录，优先级高于 jar 内 application.yml（仅当 config/application.yml 存在时生效）
      - ./config:/app/config
    # Windows(Docker Desktop) 注意：绑定挂载要求「Settings → Resources → File Sharing」
    # 勾选宿主机所在盘（如 C:），否则容器内的挂载目录会为空/挂载失败（表现为"挂载目录不对"）。
    # 用方式B命名卷则可规避此限制。
    # 数据库模式：取消注释以在 magic-api 启动前等待 mysql 就绪
    depends_on:
     - mysql
    restart: unless-stopped

  # ---- 可选：随容器启动的 MySQL（生产建议用外部托管数据库） ----
  # 启用步骤：取消注释本服务，并把上方 magic-api 的 depends_on 打开；
  #          再在 .env 中填写 SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/magic_api?... 并清空 DATASOURCE_EXCLUDE。
  mysql:
    image: mysql:8.4.0
    container_name: magic-api-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magic
      MYSQL_USER: magic
      MYSQL_PASSWORD: magic

    volumes:
       - magic-api-mysql:/var/lib/mysql
    restart: unless-stopped

volumes:
  # 命名卷备选：启用方式B（./data/magic-api 改为 magic-api-data）时取消注释
  magic-api-data:
  magic-api-mysql:
